name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install tools
        run: |
          if [ "$RUNNER_OS" = macOS ]; then brew install stow jq; else sudo apt-get update -y && sudo apt-get install -y stow jq; fi

      - name: Generated agents are in sync
        run: ./scripts/.local/bin/agents-sync --check

      - name: Agent workflow policy
        run: ./scripts/.local/bin/verify-agent-workflow

      - name: Tests
        run: bun test
        env:
          GIT_AUTHOR_NAME: ci
          GIT_AUTHOR_EMAIL: ci@example.invalid
          GIT_COMMITTER_NAME: ci
          GIT_COMMITTER_EMAIL: ci@example.invalid
